# 三平台发布：打 tag（如 v0.2.0）后矩阵构建并上传到同一个 GitHub Release。
# 产物含 electron-updater 需要的更新清单：
#   Windows → latest.yml（nsis）  Linux → latest-linux.yml（AppImage）  macOS → latest-mac.yml（zip）
# 前置条件：
#   1. package.json 的 build.publish.owner/repo 已改成真实仓库
#   2. 推送的 tag 与 package.json 的 version 一致（v 前缀）
# macOS 未配置签名证书：产物可使用但首次打开需用户右键打开 / xattr 去隔离；
# 正式分发前请在仓库 Secrets 配置 CSC_LINK / CSC_KEY_PASSWORD 并开启签名。

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            builder-args: '--win nsis portable'
          - os: ubuntu-latest
            builder-args: '--linux AppImage deb'
          - os: macos-latest
            builder-args: '--mac zip dmg'
            codesign: 'false'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app bundles
        run: npm run build

      - name: Package & publish to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 无 Apple 证书时禁止自动寻找签名身份（否则 mac 构建失败）
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ matrix.codesign == 'false' && 'false' || '' }}
        run: npx electron-builder ${{ matrix.builder-args }} --publish always
