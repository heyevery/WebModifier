<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>公司介绍</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<header>
  <div class="logo" data-wt-edit="brand" data-wt-type="text" data-wt-label="品牌名">云启科技</div>
</header>

<section class="about">
  <!-- @wt:edit name="about-title" type="text" label="关于我们标题" -->
  <h1>关于我们</h1>
  <!-- /@wt:edit -->
  <!-- @wt:edit name="about-desc" type="text" label="关于我们描述" -->
  <p>云启科技成立于 2018 年，致力于为企业提供数字化转型解决方案。我们的团队由来自顶尖科技公司的资深工程师和产品专家组成，已服务超过 500 家企业客户。</p>
  <!-- /@wt:edit -->
</section>

<section class="stats">
  <div class="stat">
    <div class="num" data-wt-edit="stat1-num" data-wt-type="text" data-wt-label="数据1数值">500+</div>
    <div class="label" data-wt-edit="stat1-label" data-wt-type="text" data-wt-label="数据1标签">企业客户</div>
  </div>
  <div class="stat">
    <div class="num" data-wt-edit="stat2-num" data-wt-type="text" data-wt-label="数据2数值">99.9%</div>
    <div class="label" data-wt-edit="stat2-label" data-wt-type="text" data-wt-label="数据2标签">服务可用性</div>
  </div>
  <div class="stat">
    <div class="num" data-wt-edit="stat3-num" data-wt-type="text" data-wt-label="数据3数值">50+</div>
    <div class="label" data-wt-edit="stat3-label" data-wt-type="text" data-wt-label="数据3标签">技术专家</div>
  </div>
</section>

<section class="team">
  <h2 data-wt-edit="team-title" data-wt-type="text" data-wt-label="团队标题">核心团队</h2>
  <div class="team-grid">
    <div class="member">
      <div class="avatar">👨‍💼</div>
      <h4 data-wt-edit="member1-name" data-wt-type="text" data-wt-label="成员1姓名">张明</h4>
      <div class="role" data-wt-edit="member1-role" data-wt-type="text" data-wt-label="成员1职位">创始人 & CEO</div>
    </div>
    <div class="member">
      <div class="avatar">👩‍💻</div>
      <h4 data-wt-edit="member2-name" data-wt-type="text" data-wt-label="成员2姓名">李雪</h4>
      <div class="role" data-wt-edit="member2-role" data-wt-type="text" data-wt-label="成员2职位">CTO</div>
    </div>
    <div class="member">
      <div class="avatar">🧑‍🎨</div>
      <h4 data-wt-edit="member3-name" data-wt-type="text" data-wt-label="成员3姓名">王浩</h4>
      <div class="role" data-wt-edit="member3-role" data-wt-type="text" data-wt-label="成员3职位">设计总监</div>
    </div>
  </div>
</section>

<section class="contact">
  <h2 data-wt-edit="contact-title" data-wt-type="text" data-wt-label="联系标题">联系我们</h2>
  <p data-wt-edit="contact-desc" data-wt-type="text" data-wt-label="联系描述">有项目合作意向？我们期待与您沟通。</p>
  <a href="mailto:hello@example.com" data-wt-edit="contact-btn" data-wt-type="link" data-wt-label="联系按钮">联系销售</a>
</section>

</body>
</html>
