<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>即将上线</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="page">
  <div class="bg-glow glow-1"></div>
  <div class="bg-glow glow-2"></div>

  <header class="nav">
    <!-- @wt:edit name="brand" type="text" label="品牌名称" -->
    <div class="brand">◆ Nebula</div>
    <!-- /@wt:edit -->
  </header>

  <main class="content">
    <!-- @wt:edit name="kicker" type="text" label="顶部标签" -->
    <span class="kicker">🚀 新产品即将发布</span>
    <!-- /@wt:edit -->
    <!-- @wt:edit name="title" type="text" label="主标题" -->
    <h1>更好用的团队协作工具<br />正在向你飞来</h1>
    <!-- /@wt:edit -->
    <!-- @wt:edit name="desc" type="text" label="描述" -->
    <p>我们正在打磨最后的细节。留下邮箱，上线当天第一时间通知你，还有早鸟用户专属福利。</p>
    <!-- /@wt:edit -->

    <div class="countdown">
      <div class="time-box">
        <!-- @wt:edit name="days" type="text" label="倒计时-天数" -->
        <span class="num">12</span>
        <!-- /@wt:edit -->
        <span class="unit">天</span>
      </div>
      <div class="time-box">
        <!-- @wt:edit name="hours" type="text" label="倒计时-小时" -->
        <span class="num">08</span>
        <!-- /@wt:edit -->
        <span class="unit">时</span>
      </div>
      <div class="time-box">
        <!-- @wt:edit name="minutes" type="text" label="倒计时-分钟" -->
        <span class="num">45</span>
        <!-- /@wt:edit -->
        <span class="unit">分</span>
      </div>
      <div class="time-box">
        <!-- @wt:edit name="seconds" type="text" label="倒计时-秒数" -->
        <span class="num">30</span>
        <!-- /@wt:edit -->
        <span class="unit">秒</span>
      </div>
    </div>

    <form class="subscribe" onsubmit="return false;">
      <input type="email" placeholder="输入你的邮箱地址" />
      <!-- @wt:edit name="subscribe-link" type="link" label="订阅按钮链接" -->
      <a href="#" class="subscribe-btn">上线提醒我</a>
      <!-- /@wt:edit -->
    </form>
    <!-- @wt:edit name="subscribe-note" type="text" label="订阅说明" -->
    <p class="note">仅用于上线通知，我们不会发送垃圾邮件，随时可退订。</p>
    <!-- /@wt:edit -->
  </main>

  <footer class="footer">
    <!-- @wt:edit name="footer-copy" type="text" label="页脚版权" -->
    <div>© 2026 Nebula Team · 期待与你见面</div>
    <!-- /@wt:edit -->
  </footer>
</div>

</body>
</html>
