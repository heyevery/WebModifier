<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>活动营销</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<section class="hero">
  <div class="tag" data-wt-edit="event-tag" data-wt-type="text" data-wt-label="活动标签">🔥 限时活动</div>
  <!-- @wt:edit name="event-title" type="text" label="活动标题" -->
  <h1>2024 年度创新峰会</h1>
  <!-- /@wt:edit -->
  <!-- @wt:edit name="event-desc" type="text" label="活动描述" -->
  <p>汇聚行业顶尖专家，共同探讨技术创新与未来趋势。限时免费报名，席位有限！</p>
  <!-- /@wt:edit -->
  <div class="countdown">
    <div class="box">
      <div class="num" data-wt-edit="cd-days" data-wt-type="text" data-wt-label="倒计时-天">07</div>
      <div class="label">天</div>
    </div>
    <div class="box">
      <div class="num" data-wt-edit="cd-hours" data-wt-type="text" data-wt-label="倒计时-时">18</div>
      <div class="label">时</div>
    </div>
    <div class="box">
      <div class="num" data-wt-edit="cd-mins" data-wt-type="text" data-wt-label="倒计时-分">42</div>
      <div class="label">分</div>
    </div>
  </div>
  <!-- @wt:edit name="event-cta" type="link" label="报名按钮" -->
  <a href="#register" class="cta">立即免费报名</a>
  <!-- /@wt:edit -->
</section>

<section class="highlights">
  <h2 data-wt-edit="hl-title" data-wt-type="text" data-wt-label="亮点标题">活动亮点</h2>
  <div class="grid">
    <div class="card">
      <div class="icon">🎤</div>
      <h3 data-wt-edit="hl1-title" data-wt-type="text" data-wt-label="亮点1标题">主旨演讲</h3>
      <p data-wt-edit="hl1-desc" data-wt-type="text" data-wt-label="亮点1描述">5 位行业领军人物分享前沿洞察与实践经验。</p>
    </div>
    <div class="card">
      <div class="icon">🤝</div>
      <h3 data-wt-edit="hl2-title" data-wt-type="text" data-wt-label="亮点2标题">社交 networking</h3>
      <p data-wt-edit="hl2-desc" data-wt-type="text" data-wt-label="亮点2描述">与 500+ 从业者面对面交流，拓展人脉。</p>
    </div>
    <div class="card">
      <div class="icon">🛠️</div>
      <h3 data-wt-edit="hl3-title" data-wt-type="text" data-wt-label="亮点3标题">动手工作坊</h3>
      <p data-wt-edit="hl3-desc" data-wt-type="text" data-wt-label="亮点3描述">3 场实战工作坊，边学边练，立即上手。</p>
    </div>
    <div class="card">
      <div class="icon">🎁</div>
      <h3 data-wt-edit="hl4-title" data-wt-type="text" data-wt-label="亮点4标题">抽奖好礼</h3>
      <p data-wt-edit="hl4-desc" data-wt-type="text" data-wt-label="亮点4描述">现场抽奖，iPad、耳机等丰厚奖品等你来拿。</p>
    </div>
  </div>
</section>

<section class="guests">
  <h2 data-wt-edit="guest-title" data-wt-type="text" data-wt-label="嘉宾标题">特邀嘉宾</h2>
  <div class="guest-list">
    <div class="guest">
      <div class="avatar">👨‍💼</div>
      <h4 data-wt-edit="guest1-name" data-wt-type="text" data-wt-label="嘉宾1姓名">陈博士</h4>
      <div class="title" data-wt-edit="guest1-title" data-wt-type="text" data-wt-label="嘉宾1头衔">AI 研究院院长</div>
    </div>
    <div class="guest">
      <div class="avatar">👩‍🚀</div>
      <h4 data-wt-edit="guest2-name" data-wt-type="text" data-wt-label="嘉宾2姓名">林女士</h4>
      <div class="title" data-wt-edit="guest2-title" data-wt-type="text" data-wt-label="嘉宾2头衔">独角兽 CTO</div>
    </div>
    <div class="guest">
      <div class="avatar">🧑‍🔬</div>
      <h4 data-wt-edit="guest3-name" data-wt-type="text" data-wt-label="嘉宾3姓名">周教授</h4>
      <div class="title" data-wt-edit="guest3-title" data-wt-type="text" data-wt-label="嘉宾3头衔">知名高校教授</div>
    </div>
  </div>
</section>

</body>
</html>
