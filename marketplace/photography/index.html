<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>光影集 · 摄影作品集</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- 首屏 -->
    <header class="hero">
      <nav class="nav">
        <!-- @wt:edit name="site-name" type="text" label="站点名" -->
        <span class="logo">光影集</span>
        <!-- /@wt:edit -->
        <div class="nav-links">
          <a href="#works">作品</a>
          <a href="#about">关于</a>
          <a href="#contact">联系</a>
        </div>
      </nav>
      <div class="hero-content">
        <!-- @wt:edit name="hero-title" type="text" label="主标题" -->
        <h1>用镜头收藏<br />每一束光</h1>
        <!-- /@wt:edit -->
        <!-- @wt:edit name="hero-subtitle" type="text" label="副标题" -->
        <p>独立摄影师 陈星河 · 城市 / 自然 / 人文纪实</p>
        <!-- /@wt:edit -->
      </div>
      <div class="scroll-hint">↓ 向下滚动欣赏作品</div>
    </header>

    <!-- 作品网格 -->
    <section class="section works" id="works">
      <div class="container">
        <span class="kicker">PORTFOLIO</span>
        <!-- @wt:edit name="works-title" type="text" label="作品区标题" -->
        <h2>精选作品</h2>
        <!-- /@wt:edit -->
        <div class="grid">
          <figure class="item item-tall">
            <img
              src="https://picsum.photos/seed/photo-a/700/900"
              alt="作品1"
              data-wt-edit="photo-1"
              data-wt-type="image"
              data-wt-label="作品图1"
            />
          </figure>
          <figure class="item">
            <img
              src="https://picsum.photos/seed/photo-b/700/520"
              alt="作品2"
              data-wt-edit="photo-2"
              data-wt-type="image"
              data-wt-label="作品图2"
            />
          </figure>
          <figure class="item">
            <img
              src="https://picsum.photos/seed/photo-c/700/520"
              alt="作品3"
              data-wt-edit="photo-3"
              data-wt-type="image"
              data-wt-label="作品图3"
            />
          </figure>
          <figure class="item">
            <img
              src="https://picsum.photos/seed/photo-d/700/520"
              alt="作品4"
              data-wt-edit="photo-4"
              data-wt-type="image"
              data-wt-label="作品图4"
            />
          </figure>
          <figure class="item item-wide">
            <img
              src="https://picsum.photos/seed/photo-e/1100/520"
              alt="作品5"
              data-wt-edit="photo-5"
              data-wt-type="image"
              data-wt-label="作品图5"
            />
          </figure>
          <figure class="item item-tall">
            <img
              src="https://picsum.photos/seed/photo-f/700/900"
              alt="作品6"
              data-wt-edit="photo-6"
              data-wt-type="image"
              data-wt-label="作品图6"
            />
          </figure>
        </div>
      </div>
    </section>

    <!-- 关于 -->
    <section class="section about" id="about">
      <div class="container about-grid">
        <img
          class="about-img"
          src="https://picsum.photos/seed/photographer/600/720"
          alt="摄影师照片"
          data-wt-edit="about-photo"
          data-wt-type="image"
          data-wt-label="摄影师照片"
        />
        <div class="about-text">
          <span class="kicker light">ABOUT</span>
          <!-- @wt:edit name="about-title" type="text" label="关于标题" -->
          <h2>你好，我是星河</h2>
          <!-- /@wt:edit -->
          <!-- @wt:edit name="about-text" type="text" label="关于描述" -->
          <p>
            过去七年，我带着相机走过 12 个国家、40 多座城市。从清晨的渔港到深夜的天桥，我相信每一帧平凡的瞬间都值得被认真对待。目前接受约拍、商业合作与画册定制。
          </p>
          <!-- /@wt:edit -->
        </div>
      </div>
    </section>

    <!-- 联系 -->
    <section class="contact" id="contact">
      <!-- @wt:edit name="contact-title" type="text" label="联系标题" -->
      <h2>有故事想一起记录？</h2>
      <!-- /@wt:edit -->
      <a class="contact-btn" href="#" data-wt-edit="contact-link" data-wt-type="link" data-wt-label="联系按钮">发起合作邀约</a>
    </section>

    <footer class="footer">
      <!-- @wt:edit name="footer-text" type="text" label="页脚文字" -->
      <p>© 2026 光影集 · 陈星河摄影作品</p>
      <!-- /@wt:edit -->
    </footer>
  </body>
</html>
